[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "saber11"
version = "0.1.0"
authors = [{name = "Juan Carlos Andrade Unigarro"}]
description = "Alerta temprana de bajo desempeño en la prueba Saber 11 a partir de factores socioeconómicos e institucionales"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel",
    "nbconvert",
]

[tool.setuptools.packages.find]
where = ["src/"]
